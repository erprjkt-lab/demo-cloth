# Run everything:   docker compose up -d --build
# Logs:             docker compose logs -f app
# Stop:             docker compose down        (add -v to also delete the database volume)
#
# Reads secrets from .env (copy .env.example). DATABASE_URL / DIRECT_URL in .env are
# ignored here: the containers build their URL from the POSTGRES_* variables instead.
# Defaults point at the bundled Postgres below (host "db"); set POSTGRES_HOST, POSTGRES_PORT
# and POSTGRES_SSLMODE=require to use an external server instead.

x-db-url: &db-url postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-job_challan}?sslmode=${POSTGRES_SSLMODE:-disable}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_challan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies schema + seeds admin, then exits. The app waits for it.
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      DIRECT_URL: *db-url
    command: ["sh", "docker/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      DIRECT_URL: *db-url
      # Set to true once served over HTTPS (behind a reverse proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Replaces .github/workflows/reminders.yml: pings the reminders endpoint every 15 min.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 900
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders || true
          echo
        done
    depends_on:
      - app

volumes:
  pgdata:
